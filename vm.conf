# shellcheck shell=bash
# ---------------------------------------------------------------------------
# Shared configuration for the CachyOS development VM.
# Sourced by 1-setup-host.sh, 2-create-vm.sh, 3-vmctl.sh and 4-add-cachyos-repos.sh.
#
# Edit the values here; every script reads this file.
# ---------------------------------------------------------------------------

# --- Identity --------------------------------------------------------------
VM_NAME="dev-vm"                  # libvirt domain name
VM_HOSTNAME="dev-vm"              # hostname configured inside the guest
VM_USER="dev"                     # Linux account created inside the guest
VM_USER_GECOS="Development User"

# --- Resources -------------------------------------------------------------
# The detected host has 12 hardware threads and ~31 GiB RAM.
VM_VCPUS="6"                      # virtual CPU cores
VM_RAM_MB="12288"                 # 12 GiB
VM_DISK_GB="120"                  # virtual disk size; grows automatically

# --- Networking (libvirt "default" NAT network = 192.168.122.0/24) ---------
VM_NETWORK="default"
VM_MAC="52:54:00:1d:00:01"        # fixed MAC -> stable DHCP reservation
VM_IP="192.168.122.50"            # reserved lease for that MAC
VM_SSH_USER_PORT="22"             # port sshd listens on inside the guest

# --- Storage ---------------------------------------------------------------
VM_POOL_DIR="/var/lib/libvirt/images"
VM_DIR="${VM_POOL_DIR}/${VM_NAME}"
VM_IMAGE_CACHE="${VM_POOL_DIR}/cloud-images"

# --- Guest base image ------------------------------------------------------
# Official Arch Linux cloud image (cloud-init enabled, growpart available).
ARCH_CLOUD_IMAGE_URL="https://geo.mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-cloudimg.qcow2"

# --- Guest provisioning ----------------------------------------------------
GUEST_DEV_TOOLS="true"            # false = bare VM, install tooling yourself
GUEST_ENABLE_DOCKER="true"        # install + enable Docker
GUEST_ENABLE_PODMAN="false"       # install rootless Podman instead/too
GUEST_INSTALL_DSH="true"          # install the DeepSeek Harness CLI (@deepseek-ai/dsh)
GUEST_INSTALL_PNPM="true"         # pnpm, needed for custom DSH profiles

# Written inside the guest when the provisioning attempt finishes - success OR
# failure. 2-create-vm.sh waits on it, so a single failing optional service
# cannot stall the wait until its full timeout.
PROVISION_MARKER="/etc/dev-vm-provision.complete"
# Written only when something went wrong during provisioning.
PROVISION_FAIL_MARKER="/etc/dev-vm-provision.failed"
